apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: rumah123portal-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
      - name: search
        image: hashicorp/http-echo:latest
        args: ["-listen=:8080", "-text=search success!"]
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 40m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: rumah123portal-prod
spec:
  selector:
    app: search
  ports:
  - port: 8080
    targetPort: 8080
