apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-router
  namespace: rumah123portal-prod
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }

    http {
      access_log /dev/stdout;

      server {
        listen 80;

        location = / {
          proxy_pass http://home:8080/;
        }

        location / {
          return 404;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-router
  namespace: rumah123portal-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-router
  template:
    metadata:
      labels:
        app: nginx-router
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 40m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: conf
        configMap:
          name: nginx-router
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-router
  namespace: rumah123portal-prod
spec:
  selector:
    app: nginx-router
  ports:
  - port: 80
    targetPort: 80
