# ConfigMap `stub` in namespace core-prod.
# ConfigMaps are namespaced, so both namespaces need their own copy;
# api mounts it in rumah123portal-prod, graphql/consumersiteauth in core-prod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stub
  namespace: core-prod
data:
  stub.py: |
    """Stand-in generik untuk semua service simulasi Rumah123.

    Satu image (python:3.12-slim) + satu script untuk semua service; perilaku
    diatur lewat environment variable:
      SERVICE_NAME   nama service yang tampil di jawaban JSON
      NAMESPACE      namespace tempat service jalan
      UPSTREAMS      daftar "host:port" dipisah koma, dipanggil saat ada request /graphql
      UPSTREAM_PATH  path yang dipanggil ke tiap upstream (default /health)
      REDIS_HOST     bila diisi, /health ikut melaporkan hasil koneksi TCP ke redis:6379

    Endpoint:
      GET /          -> {"service": ..., "namespace": ..., "path": ..., "status": "ok"}
      GET /health    -> {"service": ..., "status": "ok", "redis": ...?}
      GET /graphql   -> {"service": ..., "upstreams": {host: {status, body|error}}}
    """
    import json
    import os
    import socket
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    NAME = os.environ.get("SERVICE_NAME", "stub")
    NS = os.environ.get("NAMESPACE", "")
    UPSTREAMS = [u for u in os.environ.get("UPSTREAMS", "").split(",") if u]
    UPSTREAM_PATH = os.environ.get("UPSTREAM_PATH", "/health")
    REDIS_HOST = os.environ.get("REDIS_HOST", "")


    def fetch(url, timeout=3):
        try:
            with urllib.request.urlopen(url, timeout=timeout) as r:
                return {"status": r.status, "body": r.read().decode()[:500]}
        except Exception as e:
            return {"status": "error", "error": str(e)[:200]}


    def redis_check():
        if not REDIS_HOST:
            return None
        try:
            s = socket.create_connection((REDIS_HOST, 6379), timeout=2)
            s.close()
            return "ok"
        except Exception as e:
            return "unreachable: " + str(e)[:100]


    class H(BaseHTTPRequestHandler):
        def _send(self, code, obj):
            b = json.dumps(obj).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)

        def do_GET(self):
            if self.path == "/health":
                out = {"service": NAME, "status": "ok"}
                r = redis_check()
                if r is not None:
                    out["redis"] = r
                self._send(200, out)
            elif self.path == "/graphql":
                ups = {}
                for u in UPSTREAMS:
                    ups[u] = fetch("http://" + u + UPSTREAM_PATH)
                self._send(200, {"service": NAME, "namespace": NS, "upstreams": ups})
            else:
                self._send(200, {"service": NAME, "namespace": NS,
                                 "path": self.path, "status": "ok"})

        def log_message(self, *a):
            pass


    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
