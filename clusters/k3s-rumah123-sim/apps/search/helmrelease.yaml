---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: search
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./base
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: 99-charts
      version: 0.3.1
  interval: 1m0s
  releaseName: search
  targetNamespace: rumah123portal-prod
  values:
    args:
    - -listen=:8080
    - -text={"service":"search","namespace":"rumah123portal-prod","status":"ok"}
    autoscaling:
      enabled: false
    configmap:
      enabled: false
    destinationRule:
      enabled: false
    env:
      name: sim
    gitRepo:
      name: rumah123-gitops
    hpaAnnotations:
      enabled: false
    image:
      imagePullSecrets: []
      pullPolicy: IfNotPresent
      repository: hashicorp/http-echo
      tag: latest
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 2
      periodSeconds: 5
    replicaCount: 1
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    service:
      dstPort: 8080
      srcPort: 8080
      type: ClusterIP
    virtualService:
      enabled: false
    volumeMounts: []
    volumes: []

